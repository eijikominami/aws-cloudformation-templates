AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: aws-cloudformation-templates/network/vpn creates a VPN connection.

Metadata: 
  AWS::CloudFormation::Interface:
    ParameterGroups: 
      - Label: 
          default: 'Network Configuration'
        Parameters: 
          - CustomerGatewayOutsideIpAddress
          - StaticRoutesOnly
          - TransitGatewayId
          - TunnelLogs
          - TunnelLogRetentionInDays
      - Label: 
          default: 'Notofication Configuration'
        Parameters:
          - SNSForAlertArn 
          - SNSForDeploymentArn
      - Label: 
          default: 'Tag Configuration'
        Parameters:
          - Environment 
          - LogicalName
          - TagKey
          - TagValue

Parameters:
  CustomerGatewayOutsideIpAddress:
    Type: String
    AllowedPattern: ^[0-9./]*$
    Description: The Internet-routable IP address for the customer gateway's outside interface [required]
  StaticRoutesOnly:
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
    Description: Indicates whether the VPN connection uses static routes only [required] 
  TunnelLogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: The number of days to retain the VPN tunnel logs [required]
  TunnelLogs:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: Whether IKE and BGP activity is logged to CloudWatch Logs
  TransitGatewayId:
    Type: String
    AllowedPattern: .+
    Description: The ID of the transit gateway associated with the VPN connection [required] 
  SNSForAlertArn:
    Type: String
    AllowedPattern: .+
    Description: The Amazon SNS topic ARN for alert [required]
  SNSForDeploymentArn:
    Type: String
    Default: '' 
    Description: The Amazon SNS topic ARN for deployment information [required]
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - test
      - development
  LogicalName:
    Type: String
    Default: VPN
    AllowedPattern: .+
    Description: The custom prefix name [required]
  TagKey:
    Type: String
    Default: createdby
    AllowedPattern: .+
  TagValue:
    Type: String
    Default: aws-cloudformation-templates
    AllowedPattern: .+

Conditions:
  CreateTunnelLogs: !Equals [ !Ref TunnelLogs, ENABLED ]

Resources:
  CustomerGateway:
    Type: AWS::EC2::CustomerGateway
    Properties: 
      BgpAsn: 65000
      IpAddress: !Ref CustomerGatewayOutsideIpAddress
      Tags: 
        - Key: Name
          Value: !Sub cgw-${LogicalName}-${AWS::Region}
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
      Type: ipsec.1
  VPNConnection:
    Type: AWS::EC2::VPNConnection
    Properties: 
      CustomerGatewayId: !Ref CustomerGateway
      StaticRoutesOnly: !Ref StaticRoutesOnly
      Tags: 
        - Key: Name
          Value: !Sub vpn-${LogicalName}-${AWS::Region}
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
      TransitGatewayId: !Ref TransitGatewayId
      Type: ipsec.1
      # Both tunnels are logged. The three VPN metrics only report that a tunnel is
      # down, not why, so IKE and BGP logs are the only way to tell the cause.
      VpnTunnelOptionsSpecifications: !If
        - CreateTunnelLogs
        - - LogOptions:
              CloudwatchLogOptions:
                BgpLogEnabled: true
                BgpLogGroupArn: !GetAtt LogGroupForTunnel.Arn
                BgpLogOutputFormat: json
                LogEnabled: true
                LogGroupArn: !GetAtt LogGroupForTunnel.Arn
                LogOutputFormat: json
          - LogOptions:
              CloudwatchLogOptions:
                BgpLogEnabled: true
                BgpLogGroupArn: !GetAtt LogGroupForTunnel.Arn
                BgpLogOutputFormat: json
                LogEnabled: true
                LogGroupArn: !GetAtt LogGroupForTunnel.Arn
                LogOutputFormat: json
        - !Ref AWS::NoValue
  # The log group name must start with /aws/vendedlogs/ for the VPN service to write to it.
  LogGroupForTunnel:
    Condition: CreateTunnelLogs
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/vendedlogs/vpn/${LogicalName}-${AWS::Region}
      RetentionInDays: !Ref TunnelLogRetentionInDays
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
  CloudWatchAlarmVPN:
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:172664222583:applications/cloudwatch-alarm-about-vpn
        SemanticVersion: 2.2.27
      NotificationARNs: 
        - !Ref SNSForDeploymentArn
      Parameters:
        CustomAlarmName: !Ref AWS::StackName
        VpnId: !Ref VPNConnection
        SNSTopicArn: !Ref SNSForAlertArn
        Environment: !Ref Environment
        TagKey: !Ref TagKey
        TagValue: !Ref TagValue
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue