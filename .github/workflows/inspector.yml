name: Amazon Inspector Scan

on:
  pull_request:
    types: opened

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: iam-role
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ vars.AWS_INSPECTOR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The scan action is a container action whose base image lives on Amazon ECR Public,
      # where anonymous pulls share a quota across all runners and return 429 once it is spent.
      # Failing to log in leaves the pull anonymous, which is what it was before, so it is not fatal.
      - name: Log in to Amazon ECR Public
        if: steps.iam-role.outcome == 'success'
        continue-on-error: true
        run: aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      - name: Amazon Inspector Scan
        if: steps.iam-role.outcome == 'success'
        uses: aws-actions/vulnerability-scan-github-action-for-amazon-inspector@v1
        with:
          artifact_type: repository
          artifact_path: .

      - name: Upload SARIF
        if: steps.iam-role.outcome == 'success' && hashFiles('inspector-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: inspector-results.sarif
