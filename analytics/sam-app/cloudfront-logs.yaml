AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: aws-cloudformation-templates/analytics/cloudfront-logs creates CloudFront access log analysis resources.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Analytics Configuration'
        Parameters:
          - GlueDatabaseName
          - IcebergDataBucketName
          - QueryResultsBucketName
          - ScriptsBucketName
      - Label:
          default: 'CloudFront Log Configuration'
        Parameters:
          - AccessLogPrefix
          - DomainName
          - RawDataBucketName
      - Label:
          default: 'Git Integration'
        Parameters:
          - GitRepository
          - GitOwner
          - GitBranch
          - GitFolder
          - GitToken
      - Label:
          default: 'Schedule Configuration'
        Parameters:
          - ScheduleEnabled
      - Label:
          default: 'Tag Configuration'
        Parameters:
          - LogicalName
          - Environment
          - TagKey
          - TagValue

Parameters:
  AccessLogPrefix:
    Type: String
    AllowedPattern: .+
    Description: S3 prefix where CloudFront access logs are stored [required]
  DomainName:
    Type: String
    AllowedPattern: .+
    Description: Domain name of the CloudFront distribution [required]
  GitBranch:
    Type: String
    Default: main
    Description: Git branch for Visual ETL job source control
  GitFolder:
    Type: String
    Default: glue-jobs
    Description: Folder path in Git repository for Visual ETL job storage
  GitOwner:
    Type: String
    Default: ''
    Description: Git repository owner/organization name (optional)
  GitRepository:
    Type: String
    Default: ''
    Description: Git repository URL for Visual ETL job source control (optional)
  GitToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: GitHub/GitLab personal access token for authentication (optional)
  GlueDatabaseName:
    Type: String
    AllowedPattern: .+
    Description: Name of the Glue Data Catalog database [required]
  IcebergDataBucketName:
    Type: String
    Default: ''
    Description: Name of the S3 bucket for Iceberg data output
  QueryResultsBucketName:
    Type: String
    AllowedPattern: .+
    Description: Name of the S3 bucket for Athena query results [required]
  RawDataBucketName:
    Type: String
    AllowedPattern: .+
    Description: Name of the S3 bucket for raw data [required]
  ScheduleEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable scheduled execution of the ETL job
  ScriptsBucketName:
    Type: String
    Default: ''
    Description: Name of the S3 bucket for Glue scripts storage
  LogicalName:
    Type: String
    AllowedPattern: .+
    Description: Logical name for resource naming [required]
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - test
      - development
  TagKey:
    Type: String
    Default: createdby
    AllowedPattern: .+
  TagValue:
    Type: String
    Default: aws-cloudformation-templates
    AllowedPattern: .+

Conditions:
  CreateVisualETLJob: !Not [!Equals [!Ref IcebergDataBucketName, '']]
  IsScheduleEnabled: !Equals [!Ref ScheduleEnabled, 'true']

Resources:
  # IAM
  IAMRoleForGlueCrawler:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Description: !Sub IAM role for Glue Crawler in ${AWS::StackName}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3AccessForCrawler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${RawDataBucketName}
                  - !Sub arn:aws:s3:::${RawDataBucketName}/${AccessLogPrefix}*
      RoleName: !Sub ${LogicalName}-GlueCrawler-CloudFrontLogs-${AWS::Region}
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  IAMRoleForGlueETL:
    Condition: CreateVisualETLJob
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Description: !Sub IAM role for Glue ETL job in ${AWS::StackName}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${RawDataBucketName}
                  - !Sub arn:aws:s3:::${RawDataBucketName}/${AccessLogPrefix}*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${IcebergDataBucketName}
                  - !Sub arn:aws:s3:::${IcebergDataBucketName}/*
                  - !Sub arn:aws:s3:::${ScriptsBucketName}
                  - !Sub arn:aws:s3:::${ScriptsBucketName}/*
        - PolicyName: GlueDataCatalogAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:CreatePartition
                  - glue:UpdatePartition
                  - glue:DeletePartition
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*
        - PolicyName: CloudWatchLogsAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*
      RoleName: !Sub ${LogicalName}-cloudfront-logs-glue-${AWS::Region}
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  IAMRoleForVisualETLLambda:
    Condition: CreateVisualETLJob
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Description: !Sub IAM role for Visual ETL Lambda in ${AWS::StackName}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: GlueJobManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:CreateJob
                  - glue:UpdateJob
                  - glue:DeleteJob
                  - glue:GetJob
                  - glue:TagResource
                  - glue:UntagResource
                  - glue:UpdateSourceControlFromJob
                Resource: !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:job/${LogicalName}-cloudfront-logs-to-iceberg
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt IAMRoleForGlueETL.Arn
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${ScriptsBucketName}
                  - !Sub arn:aws:s3:::${ScriptsBucketName}/*
      RoleName: !Sub ${LogicalName}-cloudfront-etl-lambda-${AWS::Region}
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  # Other Resources
  AthenaNamedQueryForDailyRequests:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseName
      Description: Daily request count and total bytes for the last 30 days
      Name: !Sub ${LogicalName}-daily-requests
      QueryString: !Sub |
        SELECT "date", COUNT(*) as request_count, SUM(sc_bytes) as total_bytes
        FROM ${GlueDatabaseName}.cloudfront_access_logs
        WHERE "date" >= current_date - interval '30' day
        GROUP BY "date"
        ORDER BY "date" DESC
      WorkGroup: !Ref AthenaWorkGroupForCloudFrontLogs

  AthenaNamedQueryForRealUsers:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseName
      Description: Real user access excluding CloudWatch Synthetics for the last 7 days
      Name: !Sub ${LogicalName}-real-users
      QueryString: !Sub |
        SELECT "date", cs_uri_stem, c_ip, cs_user_agent
        FROM ${GlueDatabaseName}.cloudfront_access_logs
        WHERE cs_user_agent NOT LIKE '%CloudWatchSynthetics%'
        AND "date" >= current_date - interval '7' day
        ORDER BY "date" DESC, time DESC
        LIMIT 100
      WorkGroup: !Ref AthenaWorkGroupForCloudFrontLogs

  AthenaNamedQueryForStatusCodes:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseName
      Description: HTTP status code distribution for the last 7 days
      Name: !Sub ${LogicalName}-status-codes
      QueryString: !Sub |
        SELECT sc_status, COUNT(*) as count
        FROM ${GlueDatabaseName}.cloudfront_access_logs
        WHERE "date" >= current_date - interval '7' day
        GROUP BY sc_status
        ORDER BY count DESC
      WorkGroup: !Ref AthenaWorkGroupForCloudFrontLogs

  AthenaWorkGroupForCloudFrontLogs:
    Type: AWS::Athena::WorkGroup
    Properties:
      Description: !Sub WorkGroup for CloudFront access log analysis of ${DomainName}
      Name: !Sub ${LogicalName}-cloudfront-logs
      State: ENABLED
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub s3://${QueryResultsBucketName}/cloudfront-logs/

  GlueCrawlerForCloudFrontLogs:
    Type: AWS::Glue::Crawler
    Properties:
      DatabaseName: !Ref GlueDatabaseName
      Description: !Sub Crawler for CloudFront access logs of ${DomainName}
      Name: !Sub ${LogicalName}-cloudfront-access-logs
      Role: !GetAtt IAMRoleForGlueCrawler.Arn
      SchemaChangePolicy:
        DeleteBehavior: LOG
        UpdateBehavior: UPDATE_IN_DATABASE
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue
      Targets:
        S3Targets:
          - Path: !Sub s3://${RawDataBucketName}/${AccessLogPrefix}

  GlueTableForCloudFrontLogs:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Description: !Sub CloudFront standard access logs for ${DomainName}
        Name: cloudfront_access_logs
        Parameters:
          classification: csv
          skip.header.line.count: '2'
        StorageDescriptor:
          Columns:
            - Name: date
              Type: date
            - Name: time
              Type: string
            - Name: x_edge_location
              Type: string
            - Name: sc_bytes
              Type: bigint
            - Name: c_ip
              Type: string
            - Name: cs_method
              Type: string
            - Name: cs_host
              Type: string
            - Name: cs_uri_stem
              Type: string
            - Name: sc_status
              Type: int
            - Name: cs_referrer
              Type: string
            - Name: cs_user_agent
              Type: string
            - Name: cs_uri_query
              Type: string
            - Name: cs_cookie
              Type: string
            - Name: x_edge_result_type
              Type: string
            - Name: x_edge_request_id
              Type: string
            - Name: x_host_header
              Type: string
            - Name: cs_protocol
              Type: string
            - Name: cs_bytes
              Type: bigint
            - Name: time_taken
              Type: float
            - Name: x_forwarded_for
              Type: string
            - Name: ssl_protocol
              Type: string
            - Name: ssl_cipher
              Type: string
            - Name: x_edge_response_result_type
              Type: string
            - Name: cs_protocol_version
              Type: string
            - Name: fle_status
              Type: string
            - Name: fle_encrypted_fields
              Type: int
            - Name: c_port
              Type: int
            - Name: time_to_first_byte
              Type: float
            - Name: x_edge_detailed_result_type
              Type: string
            - Name: sc_content_type
              Type: string
            - Name: sc_content_len
              Type: bigint
            - Name: sc_range_start
              Type: bigint
            - Name: sc_range_end
              Type: bigint
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          Location: !Sub s3://${RawDataBucketName}/${AccessLogPrefix}
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            Parameters:
              field.delim: "\t"
              serialization.format: "\t"
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
        TableType: EXTERNAL_TABLE

  # Iceberg table created with empty schema. Schema is managed entirely by the
  # Visual ETL job (EnableUpdateCatalog). Retain policies prevent CloudFormation
  # from overwriting Iceberg metadata on subsequent deploys.
  GlueTableForCloudFrontLogsIceberg:
    Condition: CreateVisualETLJob
    Type: AWS::Glue::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Name: cloudfront_access_logs_iceberg
        StorageDescriptor:
          Columns:
            - Name: date
              Type: string
            - Name: time
              Type: string
            - Name: x_edge_location
              Type: string
            - Name: sc_bytes
              Type: bigint
            - Name: c_ip
              Type: string
            - Name: cs_method
              Type: string
            - Name: cs_host
              Type: string
            - Name: cs_uri_stem
              Type: string
            - Name: sc_status
              Type: int
            - Name: cs_referrer
              Type: string
            - Name: cs_user_agent
              Type: string
            - Name: cs_uri_query
              Type: string
            - Name: cs_cookie
              Type: string
            - Name: x_edge_result_type
              Type: string
            - Name: x_edge_request_id
              Type: string
            - Name: x_host_header
              Type: string
            - Name: cs_protocol
              Type: string
            - Name: cs_bytes
              Type: bigint
            - Name: time_taken
              Type: double
            - Name: x_forwarded_for
              Type: string
            - Name: ssl_protocol
              Type: string
            - Name: ssl_cipher
              Type: string
            - Name: x_edge_response_result_type
              Type: string
            - Name: cs_protocol_version
              Type: string
            - Name: fle_status
              Type: string
            - Name: fle_encrypted_fields
              Type: string
            - Name: c_port
              Type: int
            - Name: time_to_first_byte
              Type: double
            - Name: x_edge_detailed_result_type
              Type: string
            - Name: sc_content_type
              Type: string
            - Name: sc_content_len
              Type: bigint
            - Name: sc_range_start
              Type: string
            - Name: sc_range_end
              Type: string
          Location: !Sub s3://${IcebergDataBucketName}/cloudfront_access_logs_iceberg/
          InputFormat: org.apache.iceberg.mr.hive.HiveIcebergInputFormat
          OutputFormat: org.apache.iceberg.mr.hive.HiveIcebergOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.iceberg.mr.hive.HiveIcebergSerDe
        TableType: EXTERNAL_TABLE
      OpenTableFormatInput:
        IcebergInput:
          MetadataOperation: CREATE
          Version: '2'

  VisualETLJobForCloudFrontLogs:
    Condition: CreateVisualETLJob
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 300
      ServiceToken: !GetAtt VisualETLLambdaFunction.Arn
      JobName: !Sub ${LogicalName}-cloudfront-logs-to-iceberg
      RawDataBucketName: !Ref RawDataBucketName
      AccessLogPrefix: !Ref AccessLogPrefix
      IcebergDataBucketName: !Ref IcebergDataBucketName
      DatabaseName: !Ref GlueDatabaseName
      TargetTableName: cloudfront_access_logs_iceberg
      ScriptsBucketName: !Ref ScriptsBucketName
      LogicalName: !Ref LogicalName
      IAMRoleArn: !GetAtt IAMRoleForGlueETL.Arn
      GitRepository: !Ref GitRepository
      GitOwner: !Ref GitOwner
      GitBranch: !Ref GitBranch
      GitFolder: !Ref GitFolder
      GitToken: !Ref GitToken
      ForceUpdate: '2026-06-15T12:20'

  VisualETLLambdaFunction:
    Condition: CreateVisualETLJob
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${LogicalName}-cloudfront-etl-handler
      Description: Lambda function to manage CloudFront Logs Visual ETL Job via CloudFormation custom resources
      CodeUri: ../src/lambda-functions/cloudfront-etl-handler/
      Handler: app.lambda_handler
      Runtime: python3.13
      Timeout: 900
      MemorySize: 256
      Role: !GetAtt IAMRoleForVisualETLLambda.Arn
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Tracing: Active
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue

  VisualETLLambdaLogGroup:
    Condition: CreateVisualETLJob
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${LogicalName}-cloudfront-etl-handler
      RetentionInDays: 14
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  GlueTriggerForSchedule:
    Condition: IsScheduleEnabled
    Type: AWS::Glue::Trigger
    Properties:
      Actions:
        - JobName: !Sub ${LogicalName}-cloudfront-logs-to-iceberg
      Description: !Sub Scheduled trigger for ${LogicalName} CloudFront logs to Iceberg job
      Name: !Sub ${LogicalName}-cloudfront-logs-to-iceberg-schedule
      Schedule: "cron(0 19 * * ? *)"
      StartOnCreation: true
      Type: SCHEDULED

Outputs:
  AthenaWorkGroupName:
    Description: Name of the Athena WorkGroup
    Value: !Ref AthenaWorkGroupForCloudFrontLogs

  GlueCrawlerName:
    Description: Name of the Glue Crawler
    Value: !Ref GlueCrawlerForCloudFrontLogs

  GlueTableName:
    Description: Name of the Glue table for CloudFront logs
    Value: cloudfront_access_logs

  VisualETLJobName:
    Condition: CreateVisualETLJob
    Description: Name of the Visual ETL Job
    Value: !Sub ${LogicalName}-cloudfront-logs-to-iceberg
