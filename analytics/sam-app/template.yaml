AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: aws-cloudformation-templates/analytics creates analytics data processing infrastructure.

Globals:
  Function:
    Architectures:
      - arm64
    Handler: lambda_function.lambda_handler
    Runtime: python3.13
    Tracing: Active

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'CloudFront Log Analysis Configuration'
        Parameters:
          - CloudFrontLogDomainName
          - CloudFrontLogPrefix
          - CloudFrontLogSourceAccountId
          - CloudFrontLogSourceRoleName
      - Label:
          default: 'CloudWatch Synthetics Configuration'
        Parameters:
          - SyntheticsSourcePaths
          - SyntheticsLookbackDays
      - Label:
          default: 'Google Analytics Configuration'
        Parameters:
          - GoogleAnalyticsClientId
          - GoogleAnalyticsClientSecret
          - GoogleAnalyticsRefreshToken
          - GoogleAnalyticsAccessToken
      - Label:
          default: 'Notification Configuration'
        Parameters:
          - SNSForAlertArn
          - SNSForDeploymentArn
      - Label:
          default: 'Tag Configuration'
        Parameters:
          - LogicalName
          - Environment
          - TagKey
          - TagValue

Parameters:
  CloudFrontLogDomainName:
    Type: String
    Default: ''
    Description: Domain name of the CloudFront distribution for log analysis
  CloudFrontLogPrefix:
    Type: String
    Default: ''
    Description: S3 prefix where CloudFront access logs are stored
  CloudFrontLogSourceAccountId:
    Type: String
    Default: ''
    Description: Source account ID for cross-account log replication
  CloudFrontLogSourceRoleName:
    Type: String
    Default: ''
    Description: IAM role name in source account for replication
  GoogleAnalyticsAccessToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: The Google Analytics 4 OAuth2 Access Token
  GoogleAnalyticsClientId:
    Type: String
    Default: ""
    Description: Google OAuth2 Client Application ID (from Google Cloud Console)
  GoogleAnalyticsClientSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: The Google Analytics 4 OAuth2 Client Secret
  GoogleAnalyticsRefreshToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: The Google Analytics 4 OAuth2 Refresh Token
  SNSForAlertArn:
    Type: String
    Default: ""
    Description: The Amazon SNS topic ARN for alert
  SNSForDeploymentArn:
    Type: String
    Default: ""
    Description: The Amazon SNS topic ARN for deployment information
  SyntheticsSourcePaths:
    Type: String
    Default: ''
    Description: Comma-separated S3 paths holding Synthetics reports, one per Canary artifact bucket
  SyntheticsLookbackDays:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Days of report folders each Synthetics run reads. Raise it for a backfill, which is processed in batches
  LogicalName:
    Type: String
    Default: analytics
    MinLength: 3
    MaxLength: 50
    AllowedPattern: "^[a-z][a-z0-9-]*[a-z0-9]$"
    Description: The custom prefix name for resources [required]
  QuickAccountId:
    Type: String
    Default: ''
    Description: AWS Account ID of the Amazon Quick account for cross-account Athena access
  Environment:
    Type: String
    Default: development
    AllowedValues:
      - production
      - test
      - development
    Description: The deployment environment
  TagKey:
    Type: String
    Default: createdby
    AllowedPattern: .+
    Description: The tag key for resource tagging
  TagValue:
    Type: String
    Default: aws-cloudformation-templates
    AllowedPattern: .+
    Description: The tag value for resource tagging

Conditions:
  CreateGlueForCloudFrontLogs: !Not [!Equals [!Ref CloudFrontLogDomainName, '']]
  CreateGlueForSynthetics: !Not [!Equals [!Ref SyntheticsSourcePaths, '']]
  CreateQuickCrossAccountRole: !Not [!Equals [!Ref QuickAccountId, '']]
  CreateSNSForAlert: !Equals [!Ref SNSForAlertArn, ""]
  CreateSNSForDeployment: !Equals [!Ref SNSForDeploymentArn, ""]
  HasGoogleAnalyticsConfig: !Not [!Equals [!Ref GoogleAnalyticsClientSecret, ""]]
Resources:
  # Nested Stacks
  GlueForCloudFrontLogs:
    Condition: CreateGlueForCloudFrontLogs
    Type: AWS::Serverless::Application
    DependsOn: S3TableNamespace
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Location: ./cloudfront-logs.yaml
      Parameters:
        AccessLogPrefix: !Ref CloudFrontLogPrefix
        AthenaWorkGroupName: !Ref AthenaWorkGroup
        DomainName: !Ref CloudFrontLogDomainName
        Environment: !Ref Environment
        GlueDatabaseName: !Ref GlueDatabase
        IcebergDataBucketName: !Ref S3BucketForIcebergData
        TableBucketArn: !GetAtt S3TableBucket.TableBucketARN
        TableBucketName: !Sub ${LogicalName}-tables-${AWS::Region}-${AWS::AccountId}
        TableNamespace: !Sub ${LogicalName}_db
        LogicalName: !Ref LogicalName
        QueryResultsBucketName: !Ref S3BucketForQueryResults
        RawDataBucketName: !Ref S3BucketForRawData
        ScriptsBucketName: !Ref S3BucketForScripts
        TagKey: !Ref TagKey
        TagValue: !Ref TagValue
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue
        
  GlueForGoogleAnalytics:
    Condition: HasGoogleAnalyticsConfig
    Type: AWS::Serverless::Application
    DependsOn: S3TableNamespace
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Location: ./google-analytics.yaml
      Parameters:
        AccessToken: !Ref GoogleAnalyticsAccessToken
        AlertTopicArn: !Ref SNSForAlertArn
        ClientId: !Ref GoogleAnalyticsClientId
        ClientSecret: !Ref GoogleAnalyticsClientSecret
        GlueDatabaseName: !Ref GlueDatabase
        IcebergDataBucketName: !Ref S3BucketForIcebergData
        TableBucketArn: !GetAtt S3TableBucket.TableBucketARN
        TableBucketName: !Sub ${LogicalName}-tables-${AWS::Region}-${AWS::AccountId}
        TableNamespace: !Sub ${LogicalName}_db
        LogicalName: !Ref LogicalName
        QueryResultsBucketName: !Ref S3BucketForQueryResults
        RawDataBucketName: !Ref S3BucketForRawData
        RefreshToken: !Ref GoogleAnalyticsRefreshToken
        ScriptsBucketName: !Ref S3BucketForScripts
        Environment: !Ref Environment
        TagKey: !Ref TagKey
        TagValue: !Ref TagValue
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue

  GlueForSynthetics:
    Condition: CreateGlueForSynthetics
    Type: AWS::Serverless::Application
    DependsOn: S3TableNamespace
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Location: ./synthetics.yaml
      Parameters:
        AthenaWorkGroupName: !Ref AthenaWorkGroup
        GlueDatabaseName: !Ref GlueDatabase
        IcebergDataBucketName: !Ref S3BucketForIcebergData
        TableBucketArn: !GetAtt S3TableBucket.TableBucketARN
        TableBucketName: !Sub ${LogicalName}-tables-${AWS::Region}-${AWS::AccountId}
        TableNamespace: !Sub ${LogicalName}_db
        QueryResultsBucketName: !Ref S3BucketForQueryResults
        ScriptsBucketName: !Ref S3BucketForScripts
        SyntheticsSourcePaths: !Ref SyntheticsSourcePaths
        SyntheticsLookbackDays: !Ref SyntheticsLookbackDays
        LogicalName: !Ref LogicalName
        Environment: !Ref Environment
        TagKey: !Ref TagKey
        TagValue: !Ref TagValue
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue

  # Glue Data Catalog Database
  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub ${LogicalName}_db
        Description: !Sub Database for ${LogicalName} analytics platform

  # S3 Tables
  S3TableBucket:
    Type: AWS::S3Tables::TableBucket
    Properties:
      TableBucketName: !Sub ${LogicalName}-tables-${AWS::Region}-${AWS::AccountId}

  S3TableNamespace:
    Type: AWS::S3Tables::Namespace
    Properties:
      Namespace: !Sub ${LogicalName}_db
      TableBucketARN: !GetAtt S3TableBucket.TableBucketARN

  GlueCatalogForS3Tables:
    Type: AWS::Glue::Catalog
    Properties:
      Name: s3tablescatalog
      Description: !Sub Federated catalog exposing S3 table buckets to analytics services for ${LogicalName}
      FederatedCatalog:
        ConnectionName: aws:s3tables
        Identifier: !Sub arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/*
      # IAM alone governs access; Lake Formation grants are not used here.
      CreateDatabaseDefaultPermissions:
        - Principal:
            DataLakePrincipalIdentifier: IAM_ALLOWED_PRINCIPALS
          Permissions:
            - ALL
      CreateTableDefaultPermissions:
        - Principal:
            DataLakePrincipalIdentifier: IAM_ALLOWED_PRINCIPALS
          Permissions:
            - ALL
      AllowFullTableExternalDataAccess: 'True'

  # S3 Buckets
  S3BucketForIcebergData:
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub ${LogicalName}-iceberg-data-${AWS::Region}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 365
                StorageClass: STANDARD_IA
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - TransitionInDays: 1095
                StorageClass: GLACIER
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
      VersioningConfiguration:
        Status: Enabled

  S3BucketForQueryResults:
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub ${LogicalName}-query-results-${AWS::Region}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteQueryResultsAfter30Days
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  S3BucketForRawData:
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub ${LogicalName}-raw-data-${AWS::Region}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteRawDataAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
      VersioningConfiguration:
        Status: Enabled

  S3BucketForScripts:
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !Sub ${LogicalName}-scripts-${AWS::Region}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  S3BucketPolicyForRawData:
    Condition: CreateGlueForCloudFrontLogs
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3BucketForRawData
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowReplicationFromSource
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${CloudFrontLogSourceAccountId}:role/${CloudFrontLogSourceRoleName}
            Action:
              - s3:GetBucketVersioning
              - s3:ObjectOwnerOverrideToBucketOwner
              - s3:PutBucketVersioning
              - s3:ReplicateDelete
              - s3:ReplicateObject
            Resource:
              - !GetAtt S3BucketForRawData.Arn
              - !Sub ${S3BucketForRawData.Arn}/*

  # Athena
  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Description: !Sub WorkGroup for ${LogicalName} analytics
      Name: !Sub ${LogicalName}
      State: ENABLED
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub s3://${S3BucketForQueryResults}/

  # IAM Role for Quick cross-account access
  IAMRoleForQuickCrossAccountAccess:
    Condition: CreateQuickCrossAccountRole
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref QuickAccountId
            Action: sts:AssumeRole
            Condition:
              StringLike:
                sts:ExternalId: !Sub arn:aws:quicksight:*:${QuickAccountId}:datasource/*
      Description: !Sub A role required for Amazon Quick cross-account Athena access in ${AWS::StackName}
      Policies:
        - PolicyName: AthenaGlueS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AthenaAccountActions
                Effect: Allow
                Action:
                  - athena:GetCatalogs
                  - athena:GetExecutionEngine
                  - athena:GetExecutionEngines
                  - athena:GetNamespace
                  - athena:GetNamespaces
                  - athena:GetTable
                  - athena:GetTables
                  - athena:ListDataCatalogs
                  - athena:ListEngineVersions
                  - athena:ListWorkGroups
                  - athena:RunQuery
                Resource: '*'
              - Sid: AthenaWorkgroupActions
                Effect: Allow
                Action:
                  - athena:BatchGetQueryExecution
                  - athena:CancelQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryExecutions
                  - athena:GetQueryResults
                  - athena:GetQueryResultsStream
                  - athena:GetWorkGroup
                  - athena:ListQueryExecutions
                  - athena:StartQueryExecution
                  - athena:StopQueryExecution
                Resource:
                  - !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/*
              - Sid: AthenaDataCatalogActions
                Effect: Allow
                Action:
                  - athena:GetDataCatalog
                  - athena:GetDatabase
                  - athena:GetTableMetadata
                  - athena:ListDatabases
                  - athena:ListTableMetadata
                Resource:
                  - !Sub arn:aws:athena:${AWS::Region}:${AWS::AccountId}:datacatalog/*
              - Sid: GlueAccess
                Effect: Allow
                Action:
                  - glue:BatchGetPartition
                  - glue:GetCatalog
                  - glue:GetCatalogs
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:GetTable
                  - glue:GetTables
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/*/*
              - Sid: S3DataAccess
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                Resource:
                  - !GetAtt S3BucketForIcebergData.Arn
                  - !Sub ${S3BucketForIcebergData.Arn}/*
                  - !GetAtt S3BucketForRawData.Arn
                  - !Sub ${S3BucketForRawData.Arn}/*
              - Sid: S3QueryResultsAccess
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource:
                  - !GetAtt S3BucketForQueryResults.Arn
                  - !Sub ${S3BucketForQueryResults.Arn}/*
      RoleName: !Sub ${LogicalName}-QuickCrossAccountAccess-${AWS::Region}
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  # SNS Topics
  SNSForAlert:
    Condition: CreateSNSForAlert
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:172664222583:applications/sns-topic
        SemanticVersion: 2.2.27
      NotificationARNs:
        - !If
          - CreateSNSForDeployment
          - !GetAtt SNSForDeployment.Outputs.SNSTopicArn
          - !Ref SNSForDeploymentArn
      Parameters:
        TopicName: !Sub Alert-createdby-${AWS::StackName}
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue
  SNSForDeployment:
    Condition: CreateSNSForDeployment
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Serverless::Application
    Properties:
      Location:
        ApplicationId: arn:aws:serverlessrepo:us-east-1:172664222583:applications/sns-topic
        SemanticVersion: 2.2.27
      Parameters:
        TopicName: !Sub Deployment-createdby-${AWS::StackName}
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue

Outputs:
  # Google Analytics Stack Outputs
  GoogleAnalyticsStackId:
    Condition: HasGoogleAnalyticsConfig
    Description: Stack ID of the Google Analytics child stack
    Value: !Ref GlueForGoogleAnalytics

  # CloudFront Logs Stack Outputs
  CloudFrontLogsStackId:
    Condition: CreateGlueForCloudFrontLogs
    Description: Stack ID of the CloudFront Logs child stack
    Value: !Ref GlueForCloudFrontLogs

  # Synthetics Stack Outputs
  SyntheticsStackId:
    Condition: CreateGlueForSynthetics
    Description: Stack ID of the Synthetics child stack
    Value: !Ref GlueForSynthetics

  # Core Infrastructure Outputs (for reference)

  RawDataBucketName:
    Description: Name of the S3 bucket for raw data staging
    Value: !Ref S3BucketForRawData

  IcebergDataBucketName:
    Description: Name of the S3 bucket for Iceberg data storage
    Value: !Ref S3BucketForIcebergData

  ScriptsBucketName:
    Description: Name of the S3 bucket for Glue scripts storage
    Value: !Ref S3BucketForScripts

  QueryResultsBucketName:
    Description: Name of the S3 bucket for Athena query results
    Value: !Ref S3BucketForQueryResults


  AlertTopicArn:
    Description: ARN of the SNS topic for alerts
    Value: !If
      - CreateSNSForAlert
      - !GetAtt SNSForAlert.Outputs.SNSTopicArn
      - !Ref SNSForAlertArn

  AthenaWorkGroupName:
    Description: Name of the Athena WorkGroup
    Value: !Ref AthenaWorkGroup

  GlueDatabaseName:
    Description: Name of the Glue Data Catalog database
    Value: !Ref GlueDatabase

  QuickCrossAccountRoleArn:
    Condition: CreateQuickCrossAccountRole
    Description: ARN of the IAM role for Amazon Quick cross-account Athena access
    Value: !GetAtt IAMRoleForQuickCrossAccountAccess.Arn
