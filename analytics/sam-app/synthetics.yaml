AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Description: aws-cloudformation-templates/analytics/synthetics creates CloudWatch Synthetics result analysis resources.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Analytics Configuration'
        Parameters:
          - GlueDatabaseName
          - IcebergDataBucketName
          - QueryResultsBucketName
          - ScriptsBucketName
          - TableBucketArn
          - TableBucketName
          - TableNamespace
      - Label:
          default: 'Synthetics Configuration'
        Parameters:
          - SyntheticsSourcePaths
          - SyntheticsLookbackDays
      - Label:
          default: 'Tag Configuration'
        Parameters:
          - LogicalName
          - Environment
          - TagKey
          - TagValue

Parameters:
  AthenaWorkGroupName:
    Type: String
    AllowedPattern: .+
    Description: Name of the Athena WorkGroup to use [required]
  GlueDatabaseName:
    Type: String
    AllowedPattern: .+
    Description: Name of the Glue Data Catalog database [required]
  IcebergDataBucketName:
    Type: String
    AllowedPattern: .+
    Description: Name of the S3 bucket for Iceberg data output [required]
  QueryResultsBucketName:
    Type: String
    AllowedPattern: .+
    Description: Name of the S3 bucket for Athena query results [required]
  ScriptsBucketName:
    Type: String
    AllowedPattern: .+
    Description: Name of the S3 bucket for Glue scripts storage [required]
  SyntheticsSourcePaths:
    Type: String
    AllowedPattern: .+
    Description: Comma-separated S3 paths holding Synthetics reports, one per Canary artifact bucket [required]
  SyntheticsLookbackDays:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Days of report folders each run reads. Raise it for a backfill, which is processed in batches
  TableBucketArn:
    Type: String
    AllowedPattern: .+
    Description: ARN of the S3 table bucket holding the Iceberg tables [required]
  TableBucketName:
    Type: String
    AllowedPattern: .+
    Description: Name of the S3 table bucket holding the Iceberg tables [required]
  TableNamespace:
    Type: String
    AllowedPattern: .+
    Description: Namespace within the S3 table bucket [required]
  LogicalName:
    Type: String
    AllowedPattern: .+
    Description: Logical name for resource naming [required]
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - test
      - development
  TagKey:
    Type: String
    Default: createdby
    AllowedPattern: .+
  TagValue:
    Type: String
    Default: aws-cloudformation-templates
    AllowedPattern: .+


Resources:
  # IAM
  IAMRoleForGlueETL:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      Description: !Sub A role required for Glue ETL job (Synthetics) in ${AWS::StackName}
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only on any bucket, because an ARN list cannot be built from a list parameter
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::*
                  - !Sub arn:aws:s3:::*/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${IcebergDataBucketName}
                  - !Sub arn:aws:s3:::${IcebergDataBucketName}/*
                  - !Sub arn:aws:s3:::${ScriptsBucketName}
                  - !Sub arn:aws:s3:::${ScriptsBucketName}/*
        - PolicyName: GlueDataCatalogAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:CreatePartition
                  - glue:UpdatePartition
                  - glue:DeletePartition
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                Resource:
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog/s3tablescatalog/${TableBucketName}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/s3tablescatalog/${TableBucketName}/*
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/s3tablescatalog/${TableBucketName}/*
              - Effect: Allow
                Action:
                  - s3tables:GetTableBucket
                  - s3tables:GetNamespace
                  - s3tables:CreateNamespace
                  - s3tables:ListNamespaces
                  - s3tables:GetTable
                  - s3tables:ListTables
                  - s3tables:CreateTable
                  - s3tables:UpdateTableMetadataLocation
                  - s3tables:GetTableMetadataLocation
                  - s3tables:GetTableData
                  - s3tables:PutTableData
                Resource:
                  - !Ref TableBucketArn
                  - !Sub ${TableBucketArn}/table/*
        - PolicyName: CloudWatchLogsAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*
      RoleName: !Sub ${LogicalName}-synthetics-glue-${AWS::Region}
      Tags:
        - Key: environment
          Value: !Ref Environment
        - Key: !Ref TagKey
          Value: !Ref TagValue

  # Athena
  AthenaNamedQueryForAvailability:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseName
      Description: Daily availability percentage per canary
      Name: !Sub ${LogicalName}-synthetics-availability
      QueryString: !Sub |
        SELECT
          canaryname,
          cast(from_iso8601_timestamp(starttime) AS date) AS date,
          count(*) AS total_runs,
          sum(CASE WHEN executionstatus = 'SUCCEEDED' THEN 1 ELSE 0 END) AS successful_runs,
          round(cast(sum(CASE WHEN executionstatus = 'SUCCEEDED' THEN 1 ELSE 0 END) AS double) / count(*) * 100, 2) AS availability_pct
        FROM ${GlueDatabaseName}.synthetics_canary_iceberg
        GROUP BY canaryname, cast(from_iso8601_timestamp(starttime) AS date)
        ORDER BY date DESC, canaryname
      WorkGroup: !Ref AthenaWorkGroupName

  AthenaNamedQueryForFailures:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseName
      Description: Failed Synthetics runs with error details
      Name: !Sub ${LogicalName}-synthetics-failures
      QueryString: !Sub |
        SELECT
          canaryname,
          starttime,
          executionerror,
          script_failurereason
        FROM ${GlueDatabaseName}.synthetics_canary_iceberg
        WHERE executionstatus = 'FAILED'
        ORDER BY starttime DESC
        LIMIT 50
      WorkGroup: !Ref AthenaWorkGroupName

  AthenaNamedQueryForRecentResults:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseName
      Description: Recent Synthetics execution results with duration
      Name: !Sub ${LogicalName}-synthetics-recent-results
      QueryString: !Sub |
        SELECT
          canaryname,
          executionstatus,
          starttime,
          date_diff('millisecond',
            from_iso8601_timestamp(starttime),
            from_iso8601_timestamp(endtime)) AS duration_ms,
          requests_failed AS failed_requests,
          requests_2xx AS success_2xx,
          requests_4xx AS client_errors_4xx,
          requests_5xx AS server_errors_5xx
        FROM ${GlueDatabaseName}.synthetics_canary_iceberg
        ORDER BY starttime DESC
        LIMIT 100
      WorkGroup: !Ref AthenaWorkGroupName

  # Glue
  S3TableForSynthetics:
    Type: AWS::S3Tables::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableBucketARN: !Ref TableBucketArn
      Namespace: !Ref TableNamespace
      TableName: synthetics_canary_iceberg
      OpenTableFormat: ICEBERG
      WithoutMetadata: 'Yes'
      Compaction:
        Status: enabled
      SnapshotManagement:
        Status: enabled

  GlueJobForSynthetics:
    Type: AWS::Glue::Job
    Properties:
      Command:
        Name: glueetl
        PythonVersion: '3'
        ScriptLocation: !Sub s3://${ScriptsBucketName}/glue-jobs/${LogicalName}-synthetics-to-iceberg.py
      DefaultArguments:
        '--SOURCE_PATH': !Ref SyntheticsSourcePaths
        '--DATABASE_NAME': !Ref GlueDatabaseName
        '--TABLE_NAME': synthetics_canary_iceberg
        '--LOOKBACK_DAYS': !Ref SyntheticsLookbackDays
        '--datalake-formats': iceberg
        '--job-language': python
        '--enable-metrics': 'true'
        '--enable-observability-metrics': 'true'
        '--conf': !Sub >-
          spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
          --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
          --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
          --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
          --conf spark.sql.catalog.glue_catalog.glue.id=${AWS::AccountId}:s3tablescatalog/${TableBucketName}
          --conf spark.sql.catalog.glue_catalog.warehouse=s3://${TableBucketName}/warehouse/
      Description: !Sub Converts CloudWatch Synthetics reports to Iceberg for ${LogicalName}
      ExecutionClass: STANDARD
      GlueVersion: '5.0'
      Name: !Sub ${LogicalName}-synthetics-to-iceberg
      NumberOfWorkers: 5
      Role: !GetAtt IAMRoleForGlueETL.Arn
      Tags:
        environment: !Ref Environment
        createdby: !Ref TagValue
      Timeout: 60
      WorkerType: G.1X

  GlueTriggerForSchedule:
    Type: AWS::Glue::Trigger
    Properties:
      Actions:
        - JobName: !Ref GlueJobForSynthetics
      Description: !Sub Scheduled trigger for ${LogicalName} Synthetics ETL job
      Name: !Sub ${LogicalName}-synthetics-to-iceberg-schedule
      Schedule: "cron(0 19 * * ? *)"
      StartOnCreation: true
      Type: SCHEDULED

